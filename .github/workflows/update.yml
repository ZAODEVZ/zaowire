name: update

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:
  push:
    paths:
      - inbox.md

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect, check, render
        env:
          # ZAOWIRE_TOKEN: a fine-grained token with read access to the research library.
          # Without it the research source keeps its last scan and only the estate and inbox refresh.
          ZAOWIRE_TOKEN: ${{ secrets.ZAOWIRE_TOKEN || github.token }}
        run: node scripts/update.mjs
      - name: Commit
        run: |
          git config user.name "zaowire"
          git config user.email "zaowire@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "update: $(date -u +%Y-%m-%d)"
          git push
