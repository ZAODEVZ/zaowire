<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZAOwire</title>
<meta name="description" content="Every GitHub repo The ZAO has looked at, in one list that updates itself.">
<style>
  :root {
    --bg: #0b0b10; --panel: #15151e; --line: #262636; --text: #ececf2; --muted: #9a9ab0;
    --accent: #c8ff3d; --accent2: #7c5cff; --chip: #1f1f2c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f7f7fb; --panel: #ffffff; --line: #e2e2ee; --text: #15151e; --muted: #5f5f78; --chip: #efeff7; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 28px 16px 12px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .tag { color: var(--muted); margin: 4px 0 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 16px; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 15px; }
  input { flex: 1 1 220px; min-width: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { background: var(--chip); border: 1px solid var(--line); color: var(--text); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }
  .count { color: var(--muted); font-size: 13px; margin: 10px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .card a.name { color: var(--text); text-decoration: none; font-weight: 650; word-break: break-all; }
  .card a.name:hover { color: var(--accent); }
  .card .desc { color: var(--muted); font-size: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); margin-top: auto; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 7px; }
  .chip.hot { background: var(--accent); color: #111; font-weight: 600; }
  .chip.est { background: var(--accent2); color: #fff; }
  .stars { font-weight: 650; color: var(--text); }
  footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--text); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>ZAO<span>wire</span></h1>
  <p class="tag" id="tag">Every GitHub repo The ZAO has looked at, in one list that updates itself.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search repos, descriptions, areas" autocomplete="off">
    <select id="area"><option value="">All areas</option></select>
    <select id="lang"><option value="">All languages</option></select>
  </div>
  <div class="tabs" id="tabs" style="margin-top:10px">
    <button data-tab="all" class="on">All</button>
    <button data-tab="trending">Trending</button>
    <button data-tab="new">New</button>
    <button data-tab="again">Picked again</button>
    <button data-tab="estate">ZAO estate</button>
  </div>
</header>
<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing matches.</div>
</main>
<footer>
  <span id="updated"></span> · Built from the ZAO research library, the ZAO GitHub accounts and an inbox. Star counts are recorded daily. Source and data on <a href="https://github.com/ZAODEVZ/zaowire">GitHub</a>, CC0. Shape borrowed from <a href="https://starwire.foo">starwire</a>.
</footer>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  let data;
  try { data = await (await fetch("data.json?" + Date.now())).json(); }
  catch (e) { $("#count").textContent = "No data yet. Run the update first."; return; }
  $("#updated").textContent = "Updated " + data.updated;
  const repos = data.repos;
  const areas = [...new Set(repos.map((r) => r.area))].sort();
  const langs = [...new Set(repos.map((r) => r.language).filter(Boolean))].sort();
  for (const a of areas) $("#area").insertAdjacentHTML("beforeend", `<option>${a}</option>`);
  for (const l of langs) $("#lang").insertAdjacentHTML("beforeend", `<option>${l}</option>`);
  const fmt = (n) => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, "") + "k" : String(n);
  const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
  let tab = "all";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("zaowire") || "{}"); } catch (e) {}
  try { if (saved.tab) tab = saved.tab; } catch (e) {}
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const area = $("#area").value, lang = $("#lang").value;
    let list = repos.filter((r) => (!area || r.area === area) && (!lang || r.language === lang));
    if (q) list = list.filter((r) => (r.full + " " + r.description + " " + r.area + " " + r.language).toLowerCase().includes(q));
    if (tab === "trending") list = list.filter((r) => r.gain > 0 && r.stars >= 20 && !r.estate).sort((a, b) => b.score - a.score);
    else if (tab === "new") list = list.filter((r) => r.firstSeen >= weekAgo);
    else if (tab === "again") list = list.filter((r) => r.picks >= 2).sort((a, b) => b.picks - a.picks || b.stars - a.stars);
    else if (tab === "estate") list = list.filter((r) => r.estate).sort((a, b) => (a.pushed < b.pushed ? 1 : -1));
    $("#count").textContent = `${list.length} of ${repos.length} repos`;
    $("#empty").hidden = list.length > 0;
    $("#grid").innerHTML = list.map((r) => `
      <div class="card">
        <a class="name" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full)}</a>
        <div class="desc">${esc(r.description || "No description")}</div>
        <div class="meta">
          <span class="stars">⭐ ${fmt(r.stars)}</span>
          ${r.gain > 0 ? `<span class="chip hot">+${fmt(r.gain)} in ${r.gainDays}d</span>` : ""}
          ${r.estate ? `<span class="chip est">ZAO repo</span>` : ""}
          ${r.picks >= 2 ? `<span class="chip">picked ${r.picks}×</span>` : ""}
          <span class="chip">${esc(r.area)}</span>
          ${r.language ? `<span class="chip">${esc(r.language)}</span>` : ""}
          ${r.license ? `<span class="chip">${esc(r.license)}</span>` : ""}
          <span>updated ${r.pushed}</span>
          ${r.docs.length ? `<span>research ${r.docs.slice(0, 4).join(", ")}${r.docs.length > 4 ? " +" + (r.docs.length - 4) : ""}</span>` : ""}
        </div>
      </div>`).join("");
  }
  for (const b of document.querySelectorAll("#tabs button")) b.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on"); tab = b.dataset.tab;
    try { localStorage.setItem("zaowire", JSON.stringify({ tab })); } catch (e) {}
    render();
  });
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === tab));
  for (const id of ["#q", "#area", "#lang"]) $(id).addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
